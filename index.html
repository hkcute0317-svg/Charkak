<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>행복을 쫓는 우리에게 📸</title>

  <!-- Pretendard & Black Han Sans & Noto Sans KR -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Fredoka:wght@700;900&family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --vivid-pink: #E5007D;
      --deep-pink: #C7006B;
      --vivid-yellow: #FFE500;
      --white: #FFFFFF;
      --black: #111111;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, sans-serif;
      background-color: var(--vivid-pink);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px;
      position: relative;
      overflow-x: hidden;
      letter-spacing: -0.3px;
    }

    /* Starburst SVG Background */
    .bg-starburst {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-starburst svg {
      width: 140%;
      height: 140%;
      position: absolute;
      top: -20%;
      left: -20%;
      opacity: 0.95;
    }

    /* Modern Glass Card Container with fine border */
    .app-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.15);
      padding: 22px 18px;
      margin-top: 6px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 560px;
    }

    /* Header Design */
    header {
      position: relative;
      z-index: 10;
      text-align: center;
      margin-top: 6px;
      margin-bottom: 14px;
    }

    header h1 {
      font-family: 'Black Han Sans', "Pretendard Variable", sans-serif;
      font-size: 2.2rem;
      color: var(--vivid-yellow);
      letter-spacing: -0.5px;
      text-shadow: 2px 2px 0px var(--black), -1px -1px 0px var(--vivid-pink);
      line-height: 1.1;
    }

    header p {
      font-size: 0.85rem;
      font-weight: 800;
      background: var(--black);
      color: var(--vivid-yellow);
      display: inline-block;

      border-radius: 20px;
      margin-top: 6px;
    }

    /* Views Switcher */
    .step-view {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.25s ease-out forwards;
    }

    .step-view.active {
      display: flex;

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }

    .btn {

      justify-content: center;

      max-width: 320px;
      transition: all 0.15s ease;

    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-pink {
      background: var(--vivid-pink);
      color: var(--white);
    }

    .btn-disabled {
      background: #E0E0E0 !important;

    /* Yellow 3-second Fast Skip Button */
    .btn-skip-yellow {

      border: 1px solid rgba(0, 0, 0, 0.1);

    #step-1 {

    .camera-box {

    .section-title h3 {

      display: flex;

    .picker-scroll::-webkit-scrollbar { display: none; }

    .chip-btn {
      background: var(--white);
      color: var(--black);

      padding: 6px 14px;

      cursor: pointer;
      font-weight: 700;
      font-size: 0.82rem;

    /* STEP 4: Final Screen */
    .progress-track {

  </style>
</head>
<body>

  <!-- Background Starburst Graphic -->
  <div class="bg-starburst">
    <svg viewBox="0 0 500 500" preserveAspectRatio="none">
      <path d="M250,0 L275,170 L430,70 L340,210 L500,250 L340,290 L430,430 L275,330 L250,500 L225,330 L70,430 L160,290 L0,250 L160,210 L70,70 L225,170 Z" fill="#FFE500" />
    </svg>
  </div>

  <header>
    <h1>행복을 쫓는 우리에게</h1>
    <p>행운의 네잎보단 행복의 세잎 🍀</p>
  </header>

  <div class="app-card">

    <!-- STEP 1: WELCOME SCREEN -->
    <div id="step-1" class="step-view active">
      <div class="hero-badge">
        <i class="fa-solid fa-camera"></i>
      </div>
      <h2 style="font-family: 'Black Han Sans', sans-serif; font-size: 1.6rem; color: var(--black); font-weight: 400;">
        셀카 전면 촬영 준비!
      </h2>
      <p style="font-size: 0.9rem; color: #444; line-height: 1.45; font-weight: 600; margin-bottom: 6px;">
        시작 버튼을 누르면 6회 촬영이 자동 진행됩니다.<br>
        대기가 길다면 <strong>"⚡ 3초후 바로 찍기"</strong>를 터치해 주세요!
      </p>
      <button class="btn btn-pink" onclick="startCamera()">
        <i class="fa-solid fa-bolt"></i> 촬영 시작하기
      </button>
    </div>

    <!-- STEP 2: CAMERA VIEW -->
    <div id="step-2" class="step-view">
      <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="camera-guide-box"></div>
        
        <!-- Clean semi-transparent white text timer overlay (70% opacity) -->
        <div class="center-timer-overlay">
          <span id="timer">8</span>
        </div>

        <div id="flash" class="flash-overlay"></div>
      </div>

      <div class="status-badge">
        <span id="capture-count">1</span> / 6 번째 촬영 중
      </div>

      <!-- Vivid Yellow Fast Skip Button -->
      <button class="btn btn-skip-yellow" onclick="skipTo3Sec()">
        <i class="fa-solid fa-bolt-lightning"></i> ⚡ 3초후 바로 찍기!
      </button>
    </div>

    <!-- STEP 3: SELECTION & CUSTOMIZATION -->
    <div id="step-3" class="step-view">
      <div class="section-title">
        <h3>1. 사진 4장 선택 (순서대로 배치)</h3>
        <p>촬영된 6장 중 마음에 드는 4장을 선택하세요.</p>
      </div>

      <div class="shots-grid" id="shots-grid">
        <!-- Dynamic Thumbnails -->
      </div>

      <div class="picker-box">
        <label><i class="fa-solid fa-wand-magic-sparkles"></i> 필터 효과 선택</label>
        <div class="picker-scroll">
          <button class="chip-btn active" onclick="setFilter('normal', this)">원본</button>
          <button class="chip-btn" onclick="setFilter('vivid', this)">비비드</button>
          <button class="chip-btn" onclick="setFilter('bright', this)">화사하게</button>
          <button class="chip-btn" onclick="setFilter('bw', this)">흑백</button>
          <button class="chip-btn" onclick="setFilter('retro', this)">빈티지</button>
        </div>
      </div>

      <div class="picker-box" style="background: rgba(229, 0, 125, 0.15);">
        <label><i class="fa-solid fa-palette"></i> 프레임 컬러 선택</label>
        <div class="picker-scroll">
          <button class="chip-btn active" onclick="setFrame('#E5007D', this)">비비드 핑크</button>
          <button class="chip-btn" onclick="setFrame('#FFE500', this)">비비드 옐로우</button>
          <button class="chip-btn" onclick="setFrame('#FFFFFF', this)">클래식 화이트</button>
          <button class="chip-btn" onclick="setFrame('#111111', this)">매트 블랙</button>
        </div>
      </div>

      <div class="canvas-preview-holder">
        <canvas id="strip-preview" width="400" height="1200"></canvas>
      </div>

      <button id="btn-submit" class="btn btn-pink btn-disabled" onclick="proceedToFinal()" disabled style="margin-top: 8px;">
        네컷 완성하기 <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <!-- STEP 4: FINAL DOWNLOAD SCREEN -->
    <div id="step-4" class="step-view">
      <h3 id="result-title" style="font-weight: 800; font-size: 1.2rem; margin-bottom: 8px;">
        <i class="fa-solid fa-spinner fa-spin"></i> 고해상도 이미지 생성 중...
      </h3>

      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div id="result-container" style="display: none; margin-top: 8px;">
        <!-- Canvas output -->
      </div>

      <div class="result-actions" id="result-actions" style="display: none;">
        <!-- PRINT BUTTON REMOVED as requested -->
        <button class="btn btn-pink" onclick="downloadPhoto()">
          <i class="fa-solid fa-download"></i> 💾 이미지 저장하기
        </button>
        <button class="btn" style="background: #FFFFFF; color: #111;" onclick="resetBooth()">
          <i class="fa-solid fa-rotate-right"></i> 다시 찍기
        </button>
      </div>
    </div>

  </div>

  <canvas id="capture-canvas" style="display:none;"></canvas>

  <script>
    let stream = null;
    let photos = [];
    let selectedIndices = [];
    let filterType = 'normal';
    let frameColor = '#E5007D';
    
    let countdownInterval = null;
    let currentCountdown = 8;

    const TOTAL_SHOTS = 6;
    const DEFAULT_WAIT_TIME = 8;

    const video = document.getElementById('webcam');
    const timerEl = document.getElementById('timer');
    const flashEl = document.getElementById('flash');
    const countEl = document.getElementById('capture-count');
    const shotsGrid = document.getElementById('shots-grid');
    const previewCanvas = document.getElementById('strip-preview');
    const ctx = previewCanvas.getContext('2d');

    function goToStep(step) {
      document.querySelectorAll('.step-view').forEach(s => s.classList.remove('active'));
      document.getElementById(`step-${step}`).classList.add('active');
    }

    /* Start Selfie Camera */
    async function startCamera() {
      const constraints = {
        video: {
          facingMode: 'user', // Front selfie camera
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();

        goToStep(2);
        runShootingSequence();
      } catch (err) {
        console.error("Camera access error:", err);
        alert("카메라 권한을 확인할 수 없습니다. 브라우저 설정에서 카메라 접근을 허용해 주세요.");
      }
    }

    /* Auto Shooting Sequence */
    async function runShootingSequence() {
      photos = [];
      for (let i = 1; i <= TOTAL_SHOTS; i++) {
        countEl.textContent = i;
        await waitTimer(DEFAULT_WAIT_TIME);
        flashScreen();
        captureCurrentFrame();
        await new Promise(res => setTimeout(res, 800));
      }

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }

      initSelectionStep();
    }

    /* Timer Logic */
    function waitTimer(seconds) {
      return new Promise(resolve => {
        currentCountdown = seconds;
        timerEl.textContent = currentCountdown;

        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
          currentCountdown--;
          if (currentCountdown > 0) {
            timerEl.textContent = currentCountdown;
          } else {
            clearInterval(countdownInterval);
            resolve();
          }
        }, 1000);
      });
    }

    /* Fast-Forward to 3 seconds */
    function skipTo3Sec() {
      if (currentCountdown > 3) {
        currentCountdown = 3;
        timerEl.textContent = currentCountdown;
      }
    }

    function flashScreen() {
      flashEl.classList.add('active');
      setTimeout(() => flashEl.classList.remove('active'), 100);
    }

    function captureCurrentFrame() {
      const snapCanvas = document.getElementById('capture-canvas');
      snapCanvas.width = video.videoWidth || 640;
      snapCanvas.height = video.videoHeight || 480;
      const snapCtx = snapCanvas.getContext('2d');

      // Un-mirror horizontally for natural selfie output
      snapCtx.translate(snapCanvas.width, 0);
      snapCtx.scale(-1, 1);
      snapCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);

      photos.push(snapCanvas.toDataURL('image/jpeg', 0.95));
    }

    function initSelectionStep() {
      goToStep(3);
      shotsGrid.innerHTML = '';
      selectedIndices = [0, 1, 2, 3];

      photos.forEach((src, index) => {
        const card = document.createElement('div');
        card.className = 'shot-card';
        card.onclick = () => toggleSelectShot(index);

        const img = document.createElement('img');
        img.src = src;

        card.appendChild(img);
        shotsGrid.appendChild(card);
      });

      renderSelectionGridUI();
      renderStripCanvas();
    }

    function toggleSelectShot(idx) {
      const foundIdx = selectedIndices.indexOf(idx);
      if (foundIdx > -1) {
        selectedIndices.splice(foundIdx, 1);
      } else {
        if (selectedIndices.length < 4) {
          selectedIndices.push(idx);
        } else {
          alert("4장이 모두 선택되었습니다.");
        }
      }
      renderSelectionGridUI();
      renderStripCanvas();
    }

    function renderSelectionGridUI() {
      const cards = shotsGrid.querySelectorAll('.shot-card');
      cards.forEach((card, idx) => {
        const pos = selectedIndices.indexOf(idx);
        const oldBadge = card.querySelector('.badge-num');
        if (oldBadge) oldBadge.remove();

        if (pos > -1) {
          card.classList.add('selected');
          const badge = document.createElement('div');
          badge.className = 'badge-num';
          badge.textContent = pos + 1;
          card.appendChild(badge);
        } else {
          card.classList.remove('selected');
        }
      });

      const btnSubmit = document.getElementById('btn-submit');
      if (selectedIndices.length === 4) {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('btn-disabled');
      } else {
        btnSubmit.disabled = true;
        btnSubmit.classList.add('btn-disabled');
      }
    }

    function setFilter(type, btn) {
      filterType = type;
      btn.parentElement.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderStripCanvas();
    }

    function setFrame(color, btn) {
      frameColor = color;
      btn.parentElement.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderStripCanvas();
    }

    /* Canvas Drawing for Photo Frame with "행복을 쫓는 우리에게" */
    function renderStripCanvas() {
      const w = 400;
      const h = 1200;
      previewCanvas.width = w;
      previewCanvas.height = h;

      // 1. Frame Background
      ctx.fillStyle = frameColor;
      ctx.fillRect(0, 0, w, h);

      // 2. Draw Photo Slots
      const margin = 20;
      const photoW = w - (margin * 2);
      const photoH = 220;
      const gap = 16;
      const startY = 28;

      for (let i = 0; i < 4; i++) {
        const y = startY + i * (photoH + gap);

        if (i < selectedIndices.length) {
          const imgIndex = selectedIndices[i];
          const img = new Image();
          img.src = photos[imgIndex];

          ctx.save();
          applyFilterEffects(ctx, filterType);

          // Center Crop
          const targetAspect = photoW / photoH;
          let sx = 0, sy = 0, sW = img.width || 640, sH = img.height || 480;
          if (sW / sH > targetAspect) {
            sW = sH * targetAspect;
            sx = ((img.width || 640) - sW) / 2;
          } else {
            sH = sW / targetAspect;
            sy = ((img.height || 480) - sH) / 2;
          }

          ctx.drawImage(img, sx, sy, sW, sH, margin, y, photoW, photoH);
          ctx.restore();
        } else {
          ctx.fillStyle = 'rgba(0,0,0,0.08)';
          ctx.fillRect(margin, y, photoW, photoH);
          ctx.fillStyle = '#888888';
          ctx.font = 'bold 16px Pretendard';
          ctx.textAlign = 'center';
          ctx.fillText(`${i + 1}번 선택 안됨`, w / 2, y + photoH / 2);
        }
      }

      const footerY = startY + 4 * (photoH + gap) + 12;
      const isDarkFrame = (frameColor === '#111111');
      const isYellowFrame = (frameColor === '#FFE500');
      
      let primaryTextColor = '#FFFFFF';
      let subTextColor = '#FFFFFF';

      if (isYellowFrame) {
        primaryTextColor = '#111111';
        subTextColor = '#E5007D';
      } else if (frameColor === '#FFFFFF') {
        primaryTextColor = '#111111';
        subTextColor = '#E5007D';
      }

      // Main Text: 행복을 쫓는 우리에게
      ctx.fillStyle = primaryTextColor;
      ctx.font = '900 26px "Black Han Sans", Pretendard';
      ctx.textAlign = 'center';
      ctx.fillText('행복을 쫓는 우리에게', w / 2, footerY + 36);

      // Sub Text: 행운의 네잎보단 행복의 세잎 🍀
      ctx.fillStyle = subTextColor;
      ctx.font = '700 13px Pretendard';
      ctx.fillText('행운의 네잎보단 행복의 세잎 🍀', w / 2, footerY + 62);

      // Date Stamp
      const today = new Date().toISOString().slice(0, 10).replace(/-/g, '.');
      ctx.fillStyle = primaryTextColor;
      ctx.font = '500 11px Pretendard';
      ctx.globalAlpha = 0.75;
      ctx.fillText(today, w / 2, footerY + 84);
      ctx.globalAlpha = 1.0;
    }

    function applyFilterEffects(ctx, type) {
      switch (type) {
        case 'vivid':
          ctx.filter = 'saturate(160%) contrast(110%) brightness(105%)';
          break;
        case 'bright':
          ctx.filter = 'brightness(112%) contrast(105%) saturate(108%)';
          break;
        case 'bw':
          ctx.filter = 'grayscale(100%) contrast(120%)';
          break;
        case 'retro':
          ctx.filter = 'sepia(40%) hue-rotate(-15deg) saturate(125%)';
          break;
        default:
          ctx.filter = 'none';
      }
    }

    /* Step 4: Finalize & Download Only */
    function proceedToFinal() {
      goToStep(4);
      const fill = document.getElementById('progress-fill');
      const title = document.getElementById('result-title');
      const container = document.getElementById('result-container');
      const actions = document.getElementById('result-actions');

      let val = 0;
      const timer = setInterval(() => {
        val += 25;
        fill.style.width = val + '%';

        if (val >= 100) {
          clearInterval(timer);
          document.getElementById('progress-track').style.display = 'none';
          title.innerHTML = '🎉 네컷 사진이 완성되었습니다!';

          container.innerHTML = '';
          const finalCanvas = document.createElement('canvas');
          finalCanvas.width = previewCanvas.width;
          finalCanvas.height = previewCanvas.height;
          finalCanvas.style.maxHeight = '380px';
          finalCanvas.style.borderRadius = '10px';
          finalCanvas.style.boxShadow = '0 8px 24px rgba(0,0,0,0.15)';
          finalCanvas.getContext('2d').drawImage(previewCanvas, 0, 0);

          container.appendChild(finalCanvas);
          container.style.display = 'block';
          actions.style.display = 'flex';
        }
      }, 120);
    }

    function downloadPhoto() {
      const link = document.createElement('a');
      link.download = `행복을_쫓는_우리에게_${Date.now()}.png`;
      link.href = previewCanvas.toDataURL('image/png');
      link.click();
    }

    function resetBooth() {
      location.reload();
    }
  </script>
</body>
</html>
