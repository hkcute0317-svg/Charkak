<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>인생네컷 - 행복을 쫓는 우리에게</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg-pink: #FF007A;
      --star-yellow: #FFD600;
      --text-black: #111111;
      --border-black: #111111;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-pink);
      color: var(--text-black);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 배경 스타버스트 패턴 */
    .starburst-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 150vmax;
      height: 150vmax;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      background: conic-gradient(
        from 0deg,
        var(--star-yellow) 0deg 18deg,
        transparent 18deg 36deg,
        var(--star-yellow) 36deg 54deg,
        transparent 54deg 72deg,
        var(--star-yellow) 72deg 90deg,
        transparent 90deg 108deg,
        var(--star-yellow) 108deg 126deg,
        transparent 126deg 144deg,
        var(--star-yellow) 144deg 162deg,
        transparent 162deg 180deg,
        var(--star-yellow) 180deg 198deg,
        transparent 198deg 216deg,
        var(--star-yellow) 216deg 234deg,
        transparent 234deg 252deg,
        var(--star-yellow) 252deg 270deg,
        transparent 270deg 288deg,
        var(--star-yellow) 288deg 306deg,
        transparent 306deg 324deg,
        var(--star-yellow) 324deg 342deg,
        transparent 342deg 360deg
      );
      opacity: 0.85;
    }

    #app {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
    }

    /* 헤더 */
    header {
      text-align: center;
      margin-bottom: 16px;
    }

    .main-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--text-black);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .sub-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
    }

    /* 섹션 공통 스타일 */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex: 1;
    }

    .screen.active {
      display: flex;
    }

    /* 카드 컨테이너 */
    .card {
      background: #ffffff;
      border: 2.5px solid var(--border-black);
      border-radius: 20px;
      width: 100%;
      padding: 16px;
      box-shadow: 4px 4px 0px var(--border-black);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 카메라 화면 */
    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--border-black);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* 중앙 반투명 흰색 카운트다운 */
    .countdown-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.65);
      pointer-events: none;
      display: none;
      z-index: 5;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .flash {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    .flash.animate {
      animation: flash-anim 0.3s ease-out;
    }

    @keyframes flash-anim {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* 촬영 정보 및 컨트롤 */
    .shot-status {
      margin: 12px 0;
      font-size: 15px;
      font-weight: 800;
      color: var(--text-black);
    }

    /* 버튼 스타일 */
    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 2px solid var(--border-black);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      box-shadow: 3px 3px 0px var(--border-black);
      transition: transform 0.05s, box-shadow 0.05s;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border-black);
    }

    .btn-yellow {
      background: var(--star-yellow);
      color: var(--text-black);
    }

    .btn-pink {
      background: var(--bg-pink);
      color: #ffffff;
    }

    .btn-black {
      background: var(--text-black);
      color: #ffffff;
    }

    /* 썸네일 바둑판 그리드 (Step 4) */
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin-bottom: 16px;
    }

    .thumb-item {
      position: relative;
      aspect-ratio: 4 / 3;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border-black);
      cursor: pointer;
      background: #eee;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .thumb-item.selected::after {
      content: attr(data-order);
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--bg-pink);
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      border: 1.5px solid white;
    }

    /* 프레임 및 옵션 선택 */
    .option-group {
      width: 100%;
      margin-bottom: 12px;
    }

    .option-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text-black);
    }

    .option-buttons {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .opt-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border-black);
      background: #f5f5f5;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .opt-btn.active {
      background: var(--bg-pink);
      color: white;
    }

    /* 결과물 캔버스 미리보기 (Step 5) */
    .preview-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 3px 3px 0px var(--border-black);
      border: 2px solid var(--border-black);
    }

    .hidden-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="starburst-bg"></div>

  <div id="app">
    <header>
      <h1 class="main-title">행복을 쫓는 우리에게</h1>
      <p class="sub-title">행운의 네잎보다 행복의 세잎 🍀</p>
    </header>

    <!-- STEP 1: 시작 화면 -->
    <section id="step-1" class="screen active">
      <div class="card" style="margin-top: auto; margin-bottom: auto; text-align: center; padding: 30px 20px;">
        <div style="font-size: 50px; margin-bottom: 10px;">📸</div>
        <h2 style="font-size: 20px; font-weight: 900; margin-bottom: 8px;">네컷사진 촬영하기</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 24px; line-weight: 1.4;">
          총 6번 촬영 후 마음에 드는<br>사진 4장을 선택할 수 있어요!
        </p>
        <button class="btn btn-yellow" onclick="startCamera()">촬영 시작하기 ⚡</button>
      </div>
    </section>

    <!-- STEP 2: 사진 촬영 -->
    <section id="step-2" class="screen">
      <div class="card">
        <div class="camera-box">
          <video id="webcam" autoplay playsinline muted></video>
          <div id="countdown" class="countdown-overlay">8</div>
          <div id="flash" class="flash"></div>
        </div>
        <div class="shot-status" id="shot-status">준비 중...</div>
        <button id="quick-btn" class="btn btn-yellow" onclick="triggerQuickShot()">⚡ 3초후 바로 찍기</button>
      </div>
    </section>

    <!-- STEP 3: 4장 선택 및 필터/프레임 선택 -->
    <section id="step-3" class="screen">
      <div class="card">
        <h3 style="font-size: 15px; font-weight: 900; margin-bottom: 10px; width: 100%;">사진 4장 선택 (<span id="select-count">0</span>/4)</h3>
        
        <div class="thumb-grid" id="thumb-grid"></div>

        <div class="option-group">
          <div class="option-title">필터 선택</div>
          <div class="option-buttons">
            <button class="opt-btn active" onclick="setFilter('normal', this)">원본</button>
            <button class="opt-btn" onclick="setFilter('bw', this)">흑백</button>
            <button class="opt-btn" onclick="setFilter('warm', this)">따뜻하게</button>
            <button class="opt-btn" onclick="setFilter('vivid', this)">비비드</button>
          </div>
        </div>

        <div class="option-group">
          <div class="option-title">프레임 색상</div>
          <div class="option-buttons">
            <button class="opt-btn active" onclick="setFrameColor('#FF007A', this)">핫핑크</button>
            <button class="opt-btn" onclick="setFrameColor('#FFD600', this)">옐로우</button>
            <button class="opt-btn" onclick="setFrameColor('#111111', this)">블랙</button>
            <button class="opt-btn" onclick="setFrameColor('#FFFFFF', this)">화이트</button>
          </div>
        </div>

        <button class="btn btn-black" style="margin-top: 10px;" onclick="generateFinalImage()">프레임 완성하기 ✨</button>
      </div>
    </section>

    <!-- STEP 4: 최종 결과 및 다운로드 -->
    <section id="step-4" class="screen">
      <div class="card">
        <div class="preview-container">
          <canvas id="final-canvas"></canvas>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
          <button class="btn btn-yellow" onclick="downloadImage()">📥 사진 저장하기</button>
          <button class="btn btn-pink" style="background: #eee; color: #333;" onclick="restartProcess()">🔄 다시 찍기</button>
        </div>
      </div>
    </section>
  </div>

  <canvas id="process-canvas" class="hidden-canvas"></canvas>

  <script>
    // Audio Context (효과음 생성용)
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // 사운드 재생 함수 (터치/카운트다운/셔터)
    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'pop') {
          // 버튼 터치음 (뽁!)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'beep') {
          // 카운트다운 소리 (틱!)
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'shutter') {
          // 카메라 셔터 소리 (찰칵!)
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch (e) {
        console.log("Audio play error", e);
      }
    }

    // 모든 버튼 클릭 시 터치 효과음 추가
    document.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('.thumb-item')) {
        initAudio();
        playSound('pop');
      }
    });

    // 앱 상태 변수
    let videoStream = null;
    let capturedPhotos = [];
    let selectedPhotos = [];
    let currentShotCount = 0;
    const maxShots = 6;
    let timerInterval = null;
    let currentTimerSeconds = 8;

    let currentFilter = 'normal';
    let currentFrameColor = '#FF007A';

    // 화면 전환
    function showScreen(stepId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(stepId).classList.add('active');
    }

    // 카메라 시작 (셀카 모드)
    async function startCamera() {
      initAudio();
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
          audio: false
        });
        const videoEl = document.getElementById('webcam');
        videoEl.srcObject = videoStream;
        
        capturedPhotos = [];
        selectedPhotos = [];
        currentShotCount = 0;

        showScreen('step-2');
        startShotSequence();
      } catch (err) {
        alert('카메라에 접근할 수 없습니다. 권한을 확인해주세요.');
        console.error(err);
      }
    }

    // 촬영 시퀀스 시작
    function startShotSequence() {
      if (currentShotCount >= maxShots) {
        finishShooting();
        return;
      }

      currentShotCount++;
      document.getElementById('shot-status').innerText = `${currentShotCount} / ${maxShots}번째 촬영 중`;
      document.getElementById('quick-btn').style.display = 'flex';

      currentTimerSeconds = 8;
      const countdownEl = document.getElementById('countdown');
      countdownEl.innerText = currentTimerSeconds;
      countdownEl.style.display = 'block';

      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        currentTimerSeconds--;
        if (currentTimerSeconds > 0) {
          countdownEl.innerText = currentTimerSeconds;
          playSound('beep');
        } else {
          clearInterval(timerInterval);
          takePhoto();
        }
      }, 1000);
    }

    // 3초 후 바로 찍기
    function triggerQuickShot() {
      if (currentTimerSeconds > 3) {
        currentTimerSeconds = 3;
        const countdownEl = document.getElementById('countdown');
        countdownEl.innerText = currentTimerSeconds;
        playSound('beep');
      }
    }

    // 사진 촬영
    function takePhoto() {
      document.getElementById('countdown').style.display = 'none';
      document.getElementById('quick-btn').style.display = 'none';

      // 플래시 애니메이션 & 셔터음
      const flash = document.getElementById('flash');
      flash.classList.add('animate');
      playSound('shutter');
      setTimeout(() => flash.classList.remove('animate'), 300);

      // 캔버스에 비디오 프레임 그리기
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('process-canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1); // 좌우 반전 고정
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      capturedPhotos.push(canvas.toDataURL('image/jpeg', 0.9));

      setTimeout(() => {
        startShotSequence();
      }, 1000);
    }

    // 촬영 종료
    function finishShooting() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      renderThumbnails();
      showScreen('step-3');
    }

    // 썸네일 그리드 출력
    function renderThumbnails() {
      const grid = document.getElementById('thumb-grid');
      grid.innerHTML = '';

      capturedPhotos.forEach((src, idx) => {
        const item = document.createElement('div');
        item.className = 'thumb-item';
        item.onclick = () => togglePhotoSelect(idx, item);

        const img = document.createElement('img');
        img.src = src;

        item.appendChild(img);
        grid.appendChild(item);
      });

      updateSelectCount();
    }

    // 사진 선택/해제
    function togglePhotoSelect(index, element) {
      const selectedIdx = selectedPhotos.indexOf(index);

      if (selectedIdx > -1) {
        selectedPhotos.splice(selectedIdx, 1);
        element.classList.remove('selected');
        element.removeAttribute('data-order');
      } else {
        if (selectedPhotos.length >= 4) {
          alert('사진은 최대 4장까지 선택할 수 있습니다.');
          return;
        }
        selectedPhotos.push(index);
        element.classList.add('selected');
      }

      // 순서 번호 업데이트
      document.querySelectorAll('.thumb-item').forEach((el, i) => {
        const order = selectedPhotos.indexOf(i);
        if (order > -1) {
          el.setAttribute('data-order', order + 1);
        } else {
          el.removeAttribute('data-order');
        }
      });

      updateSelectCount();
    }

    function updateSelectCount() {
      document.getElementById('select-count').innerText = selectedPhotos.length;
    }

    // 필터 변경
    function setFilter(filter, btn) {
      currentFilter = filter;
      btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // 프레임 색상 변경
    function setFrameColor(color, btn) {
      currentFrameColor = color;
      btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // 최종 고해상도 네컷 이미지 생성 (Canvas)
    async function generateFinalImage() {
      if (selectedPhotos.length !== 4) {
        alert('4장의 사진을 모두 선택해주세요!');
        return;
      }

      showScreen('step-4');

      const canvas = document.getElementById('final-canvas');
      const ctx = canvas.getContext('2d');

      // 네컷 프레임 비율 설정 (800 x 2400)
      const width = 800;
      const height = 2400;
      canvas.width = width;
      canvas.height = height;

      // 1. 프레임 배경색
      ctx.fillStyle = currentFrameColor;
      ctx.fillRect(0, 0, width, height);

      // 2. 사진 4장 그리기
      const padding = 40;
      const photoW = width - (padding * 2);
      const photoH = 430;
      const startY = 50;
      const gap = 30;

      for (let i = 0; i < 4; i++) {
        const photoIndex = selectedPhotos[i];
        const img = new Image();
        img.src = capturedPhotos[photoIndex];
        await new Promise(res => img.onload = res);

        const y = startY + i * (photoH + gap);

        ctx.save();
        
        // 필터 효과 적용
        if (currentFilter === 'bw') {
          ctx.filter = 'grayscale(100%)';
        } else if (currentFilter === 'warm') {
          ctx.filter = 'sepia(30%) saturate(120%)';
        } else if (currentFilter === 'vivid') {
          ctx.filter = 'saturate(160%) contrast(110%)';
        }

        // 이미지 크기 맞춤 및 조절
        ctx.drawImage(img, padding, y, photoW, photoH);
        ctx.restore();
      }

      // 3. 하단 텍스트 레이아웃
      const textCenterY = startY + 4 * (photoH + gap) + 100;

      // 텍스트 색상 (프레임 색상에 맞춰 대비)
      const isWhiteFrame = currentFrameColor.toUpperCase() === '#FFFFFF' || currentFrameColor.toUpperCase() === '#FFD600';
      const textColor = isWhiteFrame ? '#111111' : '#FFFFFF';

      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';

      // 문구 1: 행복을 쫓는 우리에게
      ctx.font = '900 48px "Pretendard", sans-serif';
      ctx.fillText('행복을 쫓는 우리에게', width / 2, textCenterY);

      // 문구 2: 행운의 네잎보다 행복의 세잎 🍀
      ctx.font = '700 26px "Pretendard", sans-serif';
      ctx.fillText('행운의 네잎보다 행복의 세잎 🍀', width / 2, textCenterY + 55);

      // 당일 날짜 자동 적용 (YYYY.MM.DD)
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const dateString = `${year}.${month}.${day}`;

      ctx.font = '600 22px "Pretendard", sans-serif';
      ctx.globalAlpha = 0.85;
      ctx.fillText(dateString, width / 2, textCenterY + 100);
      ctx.globalAlpha = 1.0;
    }

    // 이미지 파일 다운로드
    function downloadImage() {
      const canvas = document.getElementById('final-canvas');
      const link = document.createElement('a');
      link.download = `photo-booth-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // 처음으로 되돌아가기
    function restartProcess() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      showScreen('step-1');
    }
  </script>
</body>
</html>
