<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>행복을 쫓는 우리에게</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --hot-pink: #FF006E;
      --vivid-yellow: #FFE500;
      --black: #111111;
      --white: #FFFFFF;

      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, "Noto Sans KR",
        -apple-system, BlinkMacSystemFont, sans-serif;

      background: var(--hot-pink);
      color: var(--black);

      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 18px 12px 30px;
      overflow-x: hidden;

      position: relative;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .bg-starburst {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-starburst svg {
      width: 120%;
      height: 120%;
      position: absolute;
      top: -10%;
      left: -10%;
      opacity: 1;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: relative;
      z-index: 10;

      width: 100%;
      max-width: 440px;

      text-align: left;

      margin: 4px 0 16px;
      padding: 0 6px;
    }

    header h1 {
      font-family: "Black Han Sans", sans-serif;

      font-size: clamp(2.3rem, 11vw, 4rem);
      line-height: 0.95;

      color: var(--black);

      letter-spacing: -2px;

      text-shadow:
        2px 2px 0 var(--vivid-yellow);

      word-break: keep-all;
    }

    header p {
      display: inline-block;

      margin-top: 12px;

      background: var(--black);
      color: var(--vivid-yellow);

      font-weight: 900;
      font-size: 0.82rem;

      padding: 6px 11px;

      border-radius: 3px;

      letter-spacing: -0.3px;
    }

    /* =========================
       MAIN CARD
    ========================= */

    .app-card {
      position: relative;
      z-index: 10;

      width: 100%;
      max-width: 440px;

      background: rgba(255, 255, 255, 0.96);

      border: 3px solid var(--black);

      border-radius: 8px;

      box-shadow:
        8px 8px 0 rgba(17,17,17,0.9);

      padding: 20px 16px;

      display: flex;
      flex-direction: column;
      align-items: center;

      min-height: 560px;
    }

    /* =========================
       STEP
    ========================= */

    .step-view {
      display: none;

      width: 100%;

      flex-direction: column;
      align-items: center;

      animation: fadeIn 0.2s ease-out forwards;
    }

    .step-view.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       BUTTON
    ========================= */

    .btn {
      font-family: inherit;

      font-weight: 900;

      background: var(--vivid-yellow);
      color: var(--black);

      border: 3px solid var(--black);

      padding: 13px 20px;

      font-size: 1rem;

      border-radius: 5px;

      cursor: pointer;

      box-shadow: 4px 4px 0 var(--black);

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      width: 100%;
      max-width: 320px;

      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--black);
    }

    .btn-pink {
      background: var(--hot-pink);
      color: var(--white);
    }

    .btn-disabled {
      background: #D8D8D8 !important;
      color: #777 !important;

      border-color: #999 !important;

      box-shadow: none !important;

      cursor: not-allowed;
    }

    /* =========================
       STEP 1
    ========================= */

    #step-1 {
      padding: 25px 8px;

      text-align: center;

      gap: 15px;
    }

    .hero-badge {
      width: 105px;
      height: 105px;

      background: var(--vivid-yellow);

      border: 4px solid var(--black);

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 3rem;

      color: var(--hot-pink);

      box-shadow: 5px 5px 0 var(--black);

      margin-bottom: 5px;
    }

    #step-1 h2 {
      font-family: "Black Han Sans", sans-serif;

      font-size: 1.65rem;

      line-height: 1.1;
    }

    #step-1 p {
      font-size: 0.9rem;

      color: #333;

      line-height: 1.5;

      font-weight: 600;
    }

    /* =========================
       CAMERA
    ========================= */

    .camera-box {
      position: relative;

      width: 100%;

      aspect-ratio: 4 / 3;

      background: var(--black);

      border: 3px solid var(--black);

      border-radius: 5px;

      overflow: hidden;

      box-shadow: 5px 5px 0 var(--hot-pink);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcam {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transform: scaleX(-1);

      display: block;
    }

    .camera-guide-box {
      position: absolute;

      inset: 0;

      border: 2px dashed rgba(255,255,255,0.55);

      pointer-events: none;

      margin: 12px;

      border-radius: 3px;
    }

    .center-timer-overlay {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      pointer-events: none;

      z-index: 5;
    }

    .center-timer-overlay span {
      font-family: "Fredoka", sans-serif;

      font-size: 7rem;

      font-weight: 700;

      color: rgba(255,255,255,0.65);

      text-shadow: 0 4px 15px rgba(0,0,0,0.3);

      line-height: 1;
    }

    .flash-overlay {
      position: absolute;

      inset: 0;

      background: white;

      opacity: 0;

      pointer-events: none;

      transition: opacity 0.08s;

      z-index: 10;
    }

    .flash-overlay.active {
      opacity: 1;
    }

    .status-badge {
      font-weight: 900;

      margin-top: 14px;

      font-size: 1rem;

      background: var(--black);

      color: var(--vivid-yellow);

      padding: 7px 18px;

      border-radius: 3px;
    }

    .btn-skip-yellow {
      margin-top: 12px;

      background: var(--vivid-yellow);

      color: var(--black);
    }

    /* =========================
       SECTION
    ========================= */

    .section-title {
      width: 100%;

      text-align: left;

      margin-bottom: 12px;

      border-left: 6px solid var(--hot-pink);

      padding-left: 10px;
    }

    .section-title h3 {
      font-weight: 900;

      font-size: 1.15rem;
    }

    .section-title p {
      font-size: 0.82rem;

      color: #666;

      font-weight: 600;

      margin-top: 3px;
    }

    /* =========================
       SHOTS
    ========================= */

    .shots-grid {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 8px;

      width: 100%;

      margin-bottom: 12px;
    }

    .shot-card {
      position: relative;

      aspect-ratio: 4 / 3;

      background: #eee;

      border-radius: 4px;

      overflow: hidden;

      cursor: pointer;

      border: 2px solid rgba(0,0,0,0.15);

      transition: transform 0.1s;
    }

    .shot-card img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .shot-card.selected {
      border: 4px solid var(--hot-pink);

      transform: scale(0.96);
    }

    .shot-card .badge-num {
      position: absolute;

      top: 4px;
      left: 4px;

      background: var(--hot-pink);

      color: var(--white);

      width: 23px;
      height: 23px;

      border-radius: 50%;

      border: 2px solid var(--black);

      font-family: "Fredoka", sans-serif;

      font-size: 0.8rem;

      font-weight: 900;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       PICKERS
    ========================= */

    .picker-box {
      width: 100%;

      background: var(--vivid-yellow);

      padding: 10px 12px;

      border: 2px solid var(--black);

      border-radius: 5px;

      margin-bottom: 10px;
    }

    .picker-box label {
      display: block;

      font-weight: 900;

      font-size: 0.88rem;

      margin-bottom: 7px;

      color: var(--black);
    }

    .picker-scroll {
      display: flex;

      gap: 7px;

      overflow-x: auto;

      padding-bottom: 2px;

      scrollbar-width: none;
    }

    .picker-scroll::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      background: var(--white);

      color: var(--black);

      border: 2px solid var(--black);

      padding: 6px 12px;

      border-radius: 3px;

      cursor: pointer;

      font-weight: 800;

      font-size: 0.78rem;

      white-space: nowrap;

      box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    }

    .chip-btn.active {
      background: var(--hot-pink);

      color: var(--white);

      border-color: var(--black);
    }

    /* =========================
       CANVAS
    ========================= */

    .canvas-preview-holder {
      width: 100%;

      display: flex;

      justify-content: center;

      margin: 14px 0;
    }

    #strip-preview {
      border-radius: 3px;

      border: 3px solid var(--black);

      box-shadow: 6px 6px 0 rgba(0,0,0,0.8);

      max-height: 410px;

      width: auto;

      max-width: 100%;

      height: auto;
    }

    /* =========================
       FINAL
    ========================= */

    .progress-track {
      width: 100%;

      height: 12px;

      background: #eee;

      border: 2px solid var(--black);

      border-radius: 3px;

      overflow: hidden;

      margin: 16px 0;
    }

    .progress-fill {
      height: 100%;

      width: 0%;

      background: var(--hot-pink);

      transition: width 0.2s ease;
    }

    .result-actions {
      display: flex;

      flex-direction: column;

      gap: 10px;

      width: 100%;

      align-items: center;

      margin-top: 14px;
    }
  </style>
</head>

<body>

  <!-- =========================
       BACKGROUND
  ========================= -->

  <div class="bg-starburst">
    <svg viewBox="0 0 500 500" preserveAspectRatio="none">
      <path
        d="
          M250,0
          L285,165
          L430,70
          L345,210
          L500,250
          L345,290
          L430,430
          L285,335
          L250,500
          L215,335
          L70,430
          L155,290
          L0,250
          L155,210
          L70,70
          L215,165
          Z
        "
        fill="#FFE500"
      />
    </svg>
  </div>

  <!-- =========================
       HEADER
  ========================= -->

  <header>
    <h1>행복을 쫓는<br>우리에게</h1>

    <p>
      행운의 네잎보단 행복의 세잎
    </p>
  </header>

  <!-- =========================
       APP
  ========================= -->

  <div class="app-card">

    <!-- STEP 1 -->

    <div id="step-1" class="step-view active">

      <div class="hero-badge">
        <i class="fa-solid fa-camera"></i>
      </div>

      <h2>
        셀카 전면 촬영 준비!
      </h2>

      <p>
        시작 버튼을 누르면 6회 촬영이 자동 진행됩니다.<br>
        대기가 길다면 <strong>"⚡ 3초후 바로 찍기"</strong>를 눌러주세요.
      </p>

      <button
        class="btn btn-pink"
        onclick="playSound('pop'); startCamera()"
      >
        <i class="fa-solid fa-bolt"></i>
        촬영 시작하기
      </button>

    </div>


    <!-- STEP 2 -->

    <div id="step-2" class="step-view">

      <div class="camera-box">

        <video
          id="webcam"
          autoplay
          playsinline
          muted
        ></video>

        <div class="camera-guide-box"></div>

        <div class="center-timer-overlay">
          <span id="timer">8</span>
        </div>

        <div
          id="flash"
          class="flash-overlay"
        ></div>

      </div>

      <div class="status-badge">
        <span id="capture-count">1</span>
        / 6 번째 촬영 중
      </div>

      <button
        class="btn btn-skip-yellow"
        onclick="playSound('pop'); skipTo3Sec()"
      >
        <i class="fa-solid fa-bolt"></i>
        3초후 바로 찍기!
      </button>

    </div>


    <!-- STEP 3 -->

    <div id="step-3" class="step-view">

      <div class="section-title">
        <h3>
          1. 사진 4장 선택
        </h3>

        <p>
          촬영된 6장 중 마음에 드는 4장을 순서대로 선택하세요.
        </p>
      </div>

      <div
        class="shots-grid"
        id="shots-grid"
      ></div>


      <!-- FILTER -->

      <div class="picker-box">

        <label>
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          필터 효과
        </label>

        <div class="picker-scroll">

          <button
            class="chip-btn active"
            onclick="playSound('pop'); setFilter('normal', this)"
          >
            원본
          </button>

          <button
            class="chip-btn"
            onclick="playSound('pop'); setFilter('vivid', this)"
          >
            비비드
          </button>

          <button
            class="chip-btn"
            onclick="playSound('pop'); setFilter('bright', this)"
          >
            화사하게
          </button>

          <button
            class="chip-btn"
            onclick="playSound('pop'); setFilter('bw', this)"
          >
            흑백
          </button>

          <button
            class="chip-btn"
            onclick="playSound('pop'); setFilter('retro', this)"
          >
            빈티지
          </button>

        </div>
      </div>


      <!-- FRAME COLOR -->

      <div class="picker-box">

        <label>
          <i class="fa-solid fa-palette"></i>
          프레임 컬러
        </label>

        <div class="picker-scroll">

          <button
            class="chip-btn active"
            onclick="playSound('pop'); setFrame('#FF006E', this)"
          >
            핫핑크
          </button>

          <button
            class="chip-btn"
            onclick="playSound('pop'); setFrame('#FFE500', this)"
          >
            비비드 옐로우
          </button>

          <button
            class="chip-btn"
            onclick="playSound('pop'); setFrame('#FFFFFF', this)"
          >
            클래식 화이트
          </button>

          <button
            class="chip-btn"
            onclick="playSound('pop'); setFrame('#111111', this)"
          >
            매트 블랙
          </button>

        </div>
      </div>


      <!-- PREVIEW -->

      <div class="canvas-preview-holder">

        <canvas
          id="strip-preview"
          width="400"
          height="1200"
        ></canvas>

      </div>


      <button
        id="btn-submit"
        class="btn btn-pink btn-disabled"
        onclick="playSound('pop'); proceedToFinal()"
        disabled
      >
        네컷 완성하기
        <i class="fa-solid fa-arrow-right"></i>
      </button>

    </div>


    <!-- STEP 4 -->

    <div id="step-4" class="step-view">

      <h3
        id="result-title"
        style="
          font-weight:900;
          font-size:1.2rem;
          margin-bottom:8px;
          text-align:center;
        "
      >
        <i class="fa-solid fa-spinner fa-spin"></i>
        고해상도 이미지 생성 중...
      </h3>


      <div
        class="progress-track"
        id="progress-track"
      >
        <div
          class="progress-fill"
          id="progress-fill"
        ></div>
      </div>


      <div
        id="result-container"
        style="
          display:none;
          margin-top:8px;
          width:100%;
          text-align:center;
        "
      ></div>


      <div
        class="result-actions"
        id="result-actions"
        style="display:none;"
      >

        <button
          class="btn btn-pink"
          onclick="playSound('pop'); downloadPhoto()"
        >
          <i class="fa-solid fa-download"></i>
          이미지 저장하기
        </button>

        <button
          class="btn"
          onclick="playSound('pop'); resetBooth()"
        >
          <i class="fa-solid fa-rotate-right"></i>
          다시 찍기
        </button>

      </div>

    </div>

  </div>


  <!-- Hidden Capture Canvas -->

  <canvas
    id="capture-canvas"
    style="display:none;"
  ></canvas>


<script>

  /* =========================================================
     VARIABLES
  ========================================================= */

  let stream = null;

  let photos = [];

  let selectedIndices = [];

  let filterType = "normal";

  /* HOT PINK */
  let frameColor = "#FF006E";

  let countdownInterval = null;

  let currentCountdown = 8;

  const TOTAL_SHOTS = 6;

  const DEFAULT_WAIT_TIME = 8;


  /* DOM */

  const video =
    document.getElementById("webcam");

  const timerEl =
    document.getElementById("timer");

  const flashEl =
    document.getElementById("flash");

  const countEl =
    document.getElementById("capture-count");

  const shotsGrid =
    document.getElementById("shots-grid");

  const previewCanvas =
    document.getElementById("strip-preview");

  const ctx =
    previewCanvas.getContext("2d");


  /* =========================================================
     AUDIO
  ========================================================= */

  let audioCtx = null;

  function getAudioContext() {

    if (!audioCtx) {

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    return audioCtx;
  }


  function playSound(type) {

    try {

      const ctxAudio =
        getAudioContext();

      const now =
        ctxAudio.currentTime;


      if (type === "pop") {

        const osc =
          ctxAudio.createOscillator();

        const gain =
          ctxAudio.createGain();

        osc.type = "sine";

        osc.frequency.setValueAtTime(
          400,
          now
        );

        osc.frequency.exponentialRampToValueAtTime(
          800,
          now + 0.08
        );

        gain.gain.setValueAtTime(
          0.3,
          now
        );

        gain.gain.exponentialRampToValueAtTime(
          0.01,
          now + 0.08
        );

        osc.connect(gain);

        gain.connect(
          ctxAudio.destination
        );

        osc.start(now);

        osc.stop(now + 0.08);
      }


      else if (type === "tick") {

        const osc =
          ctxAudio.createOscillator();

        const gain =
          ctxAudio.createGain();

        osc.type = "triangle";

        osc.frequency.setValueAtTime(
          600,
          now
        );

        gain.gain.setValueAtTime(
          0.15,
          now
        );

        gain.gain.exponentialRampToValueAtTime(
          0.01,
          now + 0.06
        );

        osc.connect(gain);

        gain.connect(
          ctxAudio.destination
        );

        osc.start(now);

        osc.stop(now + 0.06);
      }


      else if (type === "shutter") {

        const osc =
          ctxAudio.createOscillator();

        const gain =
          ctxAudio.createGain();

        osc.type = "square";

        osc.frequency.setValueAtTime(
          150,
          now
        );

        osc.frequency.exponentialRampToValueAtTime(
          40,
          now + 0.12
        );

        gain.gain.setValueAtTime(
          0.4,
          now
        );

        gain.gain.exponentialRampToValueAtTime(
          0.01,
          now + 0.12
        );

        osc.connect(gain);

        gain.connect(
          ctxAudio.destination
        );

        osc.start(now);

        osc.stop(now + 0.12);
      }

    }

    catch (e) {

      console.log(
        "Audio unavailable",
        e
      );

    }

  }


  /* =========================================================
     STEP NAVIGATION
  ========================================================= */

  function goToStep(step) {

    document
      .querySelectorAll(".step-view")
      .forEach(s =>
        s.classList.remove("active")
      );

    document
      .getElementById(`step-${step}`)
      .classList.add("active");

  }


  /* =========================================================
     CAMERA
  ========================================================= */

  async function startCamera() {

    const constraints = {

      video: {

        facingMode: "user",

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }

      },

      audio: false

    };


    try {

      stream =
        await navigator.mediaDevices
          .getUserMedia(constraints);


      video.srcObject = stream;

      await video.play();


      goToStep(2);

      runShootingSequence();

    }

    catch (err) {

      console.error(
        "Camera error:",
        err
      );

      alert(
        "카메라 권한을 확인해 주세요.\n브라우저 설정에서 카메라 접근을 허용해야 합니다."
      );

    }

  }


  /* =========================================================
     SHOOTING
  ========================================================= */

  async function runShootingSequence() {

    photos = [];

    for (
      let i = 1;
      i <= TOTAL_SHOTS;
      i++
    ) {

      countEl.textContent = i;

      await waitTimer(
        DEFAULT_WAIT_TIME
      );

      flashScreen();

      playSound("shutter");

      captureCurrentFrame();

      await new Promise(
        res =>
          setTimeout(res, 800)
      );

    }


    if (stream) {

      stream
        .getTracks()
        .forEach(track =>
          track.stop()
        );

    }


    initSelectionStep();

  }


  /* =========================================================
     TIMER
  ========================================================= */

  function waitTimer(seconds) {

    return new Promise(resolve => {

      currentCountdown = seconds;

      timerEl.textContent =
        currentCountdown;

      playSound("tick");


      clearInterval(
        countdownInterval
      );


      countdownInterval =
        setInterval(() => {

          currentCountdown--;


          if (
            currentCountdown > 0
          ) {

            timerEl.textContent =
              currentCountdown;

            playSound("tick");

          }

          else {

            clearInterval(
              countdownInterval
            );

            resolve();

          }

        }, 1000);

    });

  }


  function skipTo3Sec() {

    if (currentCountdown > 3) {

      currentCountdown = 3;

      timerEl.textContent =
        currentCountdown;

      playSound("tick");

    }

  }


  function flashScreen() {

    flashEl.classList.add(
      "active"
    );

    setTimeout(() => {

      flashEl.classList.remove(
        "active"
      );

    }, 100);

  }


  /* =========================================================
     CAPTURE
  ========================================================= */

  function captureCurrentFrame() {

    const snapCanvas =
      document.getElementById(
        "capture-canvas"
      );

    snapCanvas.width =
      video.videoWidth || 640;

    snapCanvas.height =
      video.videoHeight || 480;


    const snapCtx =
      snapCanvas.getContext("2d");


    snapCtx.save();

    snapCtx.translate(
      snapCanvas.width,
      0
    );

    snapCtx.scale(
      -1,
      1
    );

    snapCtx.drawImage(
      video,
      0,
      0,
      snapCanvas.width,
      snapCanvas.height
    );

    snapCtx.restore();


    photos.push(
      snapCanvas.toDataURL(
        "image/jpeg",
        0.95
      )
    );

  }


  /* =========================================================
     SELECTION
  ========================================================= */

  function initSelectionStep() {

    goToStep(3);

    shotsGrid.innerHTML = "";

    selectedIndices = [
      0,
      1,
      2,
      3
    ];


    photos.forEach(
      (src, index) => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "shot-card";


        card.onclick = () => {

          playSound("pop");

          toggleSelectShot(
            index
          );

        };


        const img =
          document.createElement(
            "img"
          );

        img.src = src;


        card.appendChild(img);

        shotsGrid.appendChild(
          card
        );

      }
    );


    renderSelectionGridUI();

    renderStripCanvas();

  }


  function toggleSelectShot(idx) {

    const foundIdx =
      selectedIndices.indexOf(
        idx
      );


    if (foundIdx > -1) {

      selectedIndices.splice(
        foundIdx,
        1
      );

    }

    else {

      if (
        selectedIndices.length < 4
      ) {

        selectedIndices.push(
          idx
        );

      }

      else {

        alert(
          "4장이 모두 선택되었습니다."
        );

      }

    }


    renderSelectionGridUI();

    renderStripCanvas();

  }


  function renderSelectionGridUI() {

    const cards =
      shotsGrid.querySelectorAll(
        ".shot-card"
      );


    cards.forEach(
      (card, idx) => {

        const pos =
          selectedIndices.indexOf(
            idx
          );


        const oldBadge =
          card.querySelector(
            ".badge-num"
          );


        if (oldBadge) {
          oldBadge.remove();
        }


        if (pos > -1) {

          card.classList.add(
            "selected"
          );


          const badge =
            document.createElement(
              "div"
            );

          badge.className =
            "badge-num";

          badge.textContent =
            pos + 1;

          card.appendChild(
            badge
          );

        }

        else {

          card.classList.remove(
            "selected"
          );

        }

      }
    );


    const btnSubmit =
      document.getElementById(
        "btn-submit"
      );


    if (
      selectedIndices.length === 4
    ) {

      btnSubmit.disabled =
        false;

      btnSubmit.classList.remove(
        "btn-disabled"
      );

    }

    else {

      btnSubmit.disabled =
        true;

      btnSubmit.classList.add(
        "btn-disabled"
      );

    }

  }


  /* =========================================================
     FILTER
  ========================================================= */

  function setFilter(
    type,
    btn
  ) {

    filterType = type;


    btn.parentElement
      .querySelectorAll(
        ".chip-btn"
      )
      .forEach(
        b =>
          b.classList.remove(
            "active"
          )
      );


    btn.classList.add(
      "active"
    );


    renderStripCanvas();

  }


  /* =========================================================
     FRAME
  ========================================================= */

  function setFrame(
    color,
    btn
  ) {

    frameColor = color;


    btn.parentElement
      .querySelectorAll(
        ".chip-btn"
      )
      .forEach(
        b =>
          b.classList.remove(
            "active"
          )
      );


    btn.classList.add(
      "active"
    );


    renderStripCanvas();

  }


  /* =========================================================
     LOAD IMAGE
     IMPORTANT:
     Prevents canvas from drawing images
     before they are loaded.
  ========================================================= */

  function loadImage(src) {

    return new Promise(
      resolve => {

        const img =
          new Image();

        img.onload = () =>
          resolve(img);

        img.onerror = () =>
          resolve(null);

        img.src = src;

      }
    );

  }


  /* =========================================================
     FILTER EFFECT
  ========================================================= */

  function applyFilterEffects(
    ctx,
    type
  ) {

    switch (type) {

      case "vivid":

        ctx.filter =
          "saturate(160%) contrast(112%) brightness(105%)";

        break;


      case "bright":

        ctx.filter =
          "brightness(112%) contrast(105%) saturate(108%)";

        break;


      case "bw":

        ctx.filter =
          "grayscale(100%) contrast(120%)";

        break;


      case "retro":

        ctx.filter =
          "sepia(40%) hue-rotate(-15deg) saturate(125%)";

        break;


      default:

        ctx.filter =
          "none";

    }

  }


  /* =========================================================
     CANVAS FRAME
     NO CLOVER
  ========================================================= */

  async function renderStripCanvas() {

    const w = 400;

    const h = 1200;


    previewCanvas.width = w;

    previewCanvas.height = h;


    /* FRAME */

    ctx.fillStyle =
      frameColor;

    ctx.fillRect(
      0,
      0,
      w,
      h
    );


    /* PHOTOS */

    const margin = 20;

    const photoW =
      w - margin * 2;

    const photoH = 220;

    const gap = 16;

    const startY = 28;


    for (
      let i = 0;
      i < 4;
      i++
    ) {

      const y =
        startY +
        i *
        (photoH + gap);


      if (
        i <
        selectedIndices.length
      ) {

        const imgIndex =
          selectedIndices[i];


        const img =
          await loadImage(
            photos[imgIndex]
          );


        if (!img) continue;


        ctx.save();


        applyFilterEffects(
          ctx,
          filterType
        );


        const targetAspect =
          photoW / photoH;


        let sx = 0;

        let sy = 0;

        let sW =
          img.width;

        let sH =
          img.height;


        if (
          sW / sH >
          targetAspect
        ) {

          sW =
            sH *
            targetAspect;

          sx =
            (img.width - sW) /
            2;

        }

        else {

          sH =
            sW /
            targetAspect;

          sy =
            (img.height - sH) /
            2;

        }


        ctx.drawImage(
          img,

          sx,
          sy,
          sW,
          sH,

          margin,
          y,
          photoW,
          photoH
        );


        ctx.restore();

      }

      else {

        ctx.fillStyle =
          "rgba(0,0,0,0.08)";

        ctx.fillRect(
          margin,
          y,
          photoW,
          photoH
        );

        ctx.fillStyle =
          "#888";

        ctx.font =
          "bold 16px Pretendard";

        ctx.textAlign =
          "center";

        ctx.fillText(
          `${i + 1}번 선택 안됨`,
          w / 2,
          y + photoH / 2
        );

      }

    }


    /* =====================================================
       FOOTER
       BIGGER TEXT
    ===================================================== */

    const footerY =
      startY +
      4 *
      (photoH + gap) +
      12;


    let primaryTextColor =
      "#FFFFFF";

    let subTextColor =
      "#FFFFFF";


    if (
      frameColor === "#FFE500"
    ) {

      primaryTextColor =
        "#111111";

      subTextColor =
        "#FF006E";

    }


    if (
      frameColor === "#FFFFFF"
    ) {

      primaryTextColor =
        "#111111";

      subTextColor =
        "#FF006E";

    }


    /* MAIN TITLE */

    ctx.fillStyle =
      primaryTextColor;

    ctx.font =
      '900 31px "Black Han Sans", Pretendard';

    ctx.textAlign =
      "center";

    ctx.fillText(
      "행복을 쫓는 우리에게",
      w / 2,
      footerY + 40
    );


    /* SUBTITLE */

    ctx.fillStyle =
      subTextColor;

    ctx.font =
      '800 16px Pretendard';

    ctx.fillText(
      "행운의 네잎보단 행복의 세잎",
      w / 2,
      footerY + 70
    );


    /* DATE */

    const now =
      new Date();

    const year =
      now.getFullYear();

    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        now.getDate()
      ).padStart(2, "0");


    const todayFormatted =
      `${year}.${month}.${day}`;


    ctx.fillStyle =
      primaryTextColor;

    ctx.font =
      '600 14px Pretendard';

    ctx.globalAlpha =
      0.85;


    ctx.fillText(
      todayFormatted,
      w / 2,
      footerY + 96
    );


    ctx.globalAlpha =
      1;


    /* IMPORTANT:
       No clover is drawn here.
    */

  }


  /* =========================================================
     FINAL SCREEN
  ========================================================= */

  function proceedToFinal() {

    goToStep(4);


    const fill =
      document.getElementById(
        "progress-fill"
      );


    const title =
      document.getElementById(
        "result-title"
      );


    const container =
      document.getElementById(
        "result-container"
      );


    const actions =
      document.getElementById(
        "result-actions"
      );


    let val = 0;


    const timer =
      setInterval(() => {

        val += 25;


        fill.style.width =
          val + "%";


        if (
          val >= 100
        ) {

          clearInterval(
            timer
          );


          document.getElementById(
            "progress-track"
          ).style.display =
            "none";


          title.innerHTML =
            "🎉 네컷 사진이 완성되었습니다!";


          container.innerHTML =
            "";


          const finalCanvas =
            document.createElement(
              "canvas"
            );


          finalCanvas.width =
            previewCanvas.width;

          finalCanvas.height =
            previewCanvas.height;


          finalCanvas.style.maxHeight =
            "410px";

          finalCanvas.style.maxWidth =
            "100%";

          finalCanvas.style.border =
            "3px solid #111";

          finalCanvas.style.borderRadius =
            "3px";

          finalCanvas.style.boxShadow =
            "6px 6px 0 rgba(0,0,0,0.8)";


          finalCanvas
            .getContext("2d")
            .drawImage(
              previewCanvas,
              0,
              0
            );


          container.appendChild(
            finalCanvas
          );


          container.style.display =
            "block";


          actions.style.display =
            "flex";

        }

      }, 120);

  }


  /* =========================================================
     DOWNLOAD
  ========================================================= */

  function downloadPhoto() {

    const now =
      new Date();


    const dateStr =
      `${now.getFullYear()}${
        String(
          now.getMonth() + 1
        ).padStart(2, "0")
      }${
        String(
          now.getDate()
        ).padStart(2, "0")
      }`;


    const link =
      document.createElement(
        "a"
      );


    link.download =
      `행복을_쫓는_우리에게_${dateStr}.png`;


    link.href =
      previewCanvas.toDataURL(
        "image/png"
      );


    link.click();

  }


  /* =========================================================
     RESET
  ========================================================= */

  function resetBooth() {

    if (stream) {

      stream
        .getTracks()
        .forEach(track =>
          track.stop()
        );

    }


    location.reload();

  }

</script>
