<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>행복을 쫓는 우리에게 - 인생네컷</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: #FF007A;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    /* Starburst Background Graphic */
    .starburst-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 140vmax;
      height: 140vmax;
      transform: translate(-50%, -50%);
      z-index: -1;
      background: repeating-conic-gradient(
        from 0deg,
        #FFD600 0deg 15deg,
        #FF007A 15deg 30deg
      );
      opacity: 0.85;
      pointer-events: none;
    }

    header {
      width: 100%;
      padding: 20px 16px 12px;
      text-align: center;
      z-index: 10;
    }

    h1.title {
      font-size: 2rem;
      font-weight: 900;
      color: #111111;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      text-shadow: 2px 2px 0px #FFFFFF;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #111111;
      font-weight: 700;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.25s ease-out;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Camera Viewport */
    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 3/4;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #111111;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    video#webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* Transparent Overlay Countdown */
    .countdown-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 8rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.65);
      text-shadow: 0 0 20px rgba(0,0,0,0.3);
      pointer-events: none;
      display: none;
      z-index: 20;
    }

    .flash-effect {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
    }

    .flash-active {
      animation: flashAnim 0.35s ease-out;
    }

    @keyframes flashAnim {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .shot-status {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* Buttons */
    .btn-group {
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      border: 2px solid #111111;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 4px 0 #111111;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #111111;
    }

    .btn-yellow {
      background-color: #FFD600;
      color: #111111;
    }

    .btn-white {
      background-color: #FFFFFF;
      color: #111111;
    }

    /* Thumbnail Selector Grid */
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 12px;
    }

    .thumb-item {
      position: relative;
      aspect-ratio: 4/3;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #111111;
      cursor: pointer;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-item.selected::after {
      content: attr(data-order);
      position: absolute;
      top: 4px; right: 4px;
      background: #FF007A;
      color: white;
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
    }

    /* Color Picker Row */
    .options-row {
      width: 100%;
      display: flex;
      gap: 8px;
      margin: 12px 0;
      justify-content: center;
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #111111;
      cursor: pointer;
    }

    .color-btn.active {
      outline: 3px solid #111111;
      outline-offset: 2px;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="starburst-bg"></div>

  <header>
    <h1 class="title">행복을 쫓는 우리에게</h1>
    <p class="subtitle">행운의 네잎보다 행복의 세잎 ☘️</p>
  </header>

  <div class="container">
    <!-- STEP 1: 촬영 대기/시작 -->
    <div id="step-start" class="screen active">
      <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="countdown" class="countdown-overlay">8</div>
        <div id="flash" class="flash-effect"></div>
        <div id="shot-count" class="shot-status" style="display:none;">0 / 6</div>
      </div>

      <div class="btn-group">
        <button id="btn-start" class="btn btn-yellow" onclick="startPhotoShoot()">📸 촬영 시작하기</button>
        <button id="btn-quick" class="btn btn-white" onclick="triggerQuickShoot()" style="display:none;">⚡ 3초후 바로 찍기</button>
      </div>
    </div>

    <!-- STEP 2: 사진 선택 및 프레임 완성 -->
    <div id="step-select" class="screen">
      <p style="font-weight:700; color:#fff; margin-bottom:8px;">4장의 사진을 순서대로 선택하세요 (선택됨: <span id="select-count">0</span>/4)</p>
      <div id="thumb-container" class="thumb-grid"></div>

      <div style="margin-top:16px; width:100%; text-align:center;">
        <p style="font-weight:700; color:#fff; margin-bottom:6px;">프레임 색상 선택</p>
        <div class="options-row">
          <button class="color-btn active" style="background:#FF007A;" onclick="setFrameColor('#FF007A', this)"></button>
          <button class="color-btn" style="background:#FFD600;" onclick="setFrameColor('#FFD600', this)"></button>
          <button class="color-btn" style="background:#FFFFFF;" onclick="setFrameColor('#FFFFFF', this)"></button>
          <button class="color-btn" style="background:#111111;" onclick="setFrameColor('#111111', this)"></button>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-yellow" onclick="renderFinalFrame()">✨ 인생네컷 완성하기</button>
      </div>
    </div>

    <!-- STEP 3: 최종 결과 확인 및 다운로드 -->
    <div id="step-result" class="screen">
      <canvas id="photo-canvas"></canvas>
      <div class="btn-group">
        <button class="btn btn-yellow" onclick="downloadImage()">💾 이미지 저장하기</button>
        <button class="btn btn-white" onclick="resetApp()">🔄 다시 찍기</button>
      </div>
    </div>
  </div>

  <script>
    // Web Audio Synthesizer for Sound Effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playPopSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playBeepSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playShutterSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const bufferSize = audioCtx.sampleRate * 0.1;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      noise.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    // Camera and Application Variables
    const video = document.getElementById('webcam');
    const countdownEl = document.getElementById('countdown');
    const flashEl = document.getElementById('flash');
    const shotCountEl = document.getElementById('shot-count');
    const btnStart = document.getElementById('btn-start');
    const btnQuick = document.getElementById('btn-quick');

    let capturedPhotos = [];
    let selectedIndices = [];
    let timer = null;
    let currentCountdown = 8;
    let currentFrameColor = '#FF007A';

    // Init Camera Front Facing
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert('카메라 접근 권한이 필요합니다.');
      }
    }

    window.addEventListener('load', initCamera);

    // Global Click Sound
    document.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.classList.contains('thumb-item')) {
        playPopSound();
      }
    });

    function startPhotoShoot() {
      capturedPhotos = [];
      btnStart.style.display = 'none';
      btnQuick.style.display = 'flex';
      shotCountEl.style.display = 'block';
      runShootingLoop(1);
    }

    function runShootingLoop(shotIndex) {
      if (shotIndex > 6) {
        finishShooting();
        return;
      }

      shotCountEl.innerText = `${shotIndex} / 6`;
      currentCountdown = 8;
      countdownEl.innerText = currentCountdown;
      countdownEl.style.display = 'block';

      timer = setInterval(() => {
        currentCountdown--;
        if (currentCountdown > 0) {
          countdownEl.innerText = currentCountdown;
          playBeepSound();
        } else {
          clearInterval(timer);
          takeSnapshot();
          setTimeout(() => runShootingLoop(shotIndex + 1), 1000);
        }
      }, 1000);
    }

    function triggerQuickShoot() {
      if (currentCountdown > 3) {
        currentCountdown = 3;
        countdownEl.innerText = currentCountdown;
        playBeepSound();
      }
    }

    function takeSnapshot() {
      playShutterSound();
      flashEl.classList.add('flash-active');
      setTimeout(() => flashEl.classList.remove('flash-active'), 350);
      countdownEl.style.display = 'none';

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');

      // Mirror flip for front selfie camera
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      capturedPhotos.push(canvas.toDataURL('image/jpeg'));
    }

    function finishShooting() {
      document.getElementById('step-start').classList.remove('active');
      document.getElementById('step-select').classList.add('active');
      renderThumbnails();
    }

    function renderThumbnails() {
      const container = document.getElementById('thumb-container');
      container.innerHTML = '';
      selectedIndices = [];
      document.getElementById('select-count').innerText = 0;

      capturedPhotos.forEach((src, idx) => {
        const item = document.createElement('div');
        item.className = 'thumb-item';
        item.innerHTML = `<img src="${src}">`;
        item.onclick = () => toggleSelectPhoto(idx, item);
        container.appendChild(item);
      });
    }

    function toggleSelectPhoto(index, el) {
      const existIdx = selectedIndices.indexOf(index);
      if (existIdx > -1) {
        selectedIndices.splice(existIdx, 1);
      } else {
        if (selectedIndices.length < 4) {
          selectedIndices.push(index);
        }
      }
      updateThumbGridUI();
    }

    function updateThumbGridUI() {
      const items = document.querySelectorAll('.thumb-item');
      items.forEach((item, idx) => {
        const selOrder = selectedIndices.indexOf(idx);
        if (selOrder > -1) {
          item.classList.add('selected');
          item.setAttribute('data-order', selOrder + 1);
        } else {
          item.classList.remove('selected');
        }
      });
      document.getElementById('select-count').innerText = selectedIndices.length;
    }

    function setFrameColor(color, btn) {
      currentFrameColor = color;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function renderFinalFrame() {
      if (selectedIndices.length < 4) {
        alert('사진 4장을 모두 선택해주세요!');
        return;
      }

      document.getElementById('step-select').classList.remove('active');
      document.getElementById('step-result').classList.add('active');

      const canvas = document.getElementById('photo-canvas');
      const ctx = canvas.getContext('2d');

      const width = 600;
      const height = 1800;
      canvas.width = width;
      canvas.height = height;

      // Draw Frame Background
      ctx.fillStyle = currentFrameColor;
      ctx.fillRect(0, 0, width, height);

      // Photo Layout Config
      const photoW = 520;
      const photoH = 350;
      const startX = 40;
      const startY = 40;
      const gapY = 30;

      let loaded = 0;
      selectedIndices.forEach((photoIdx, i) => {
        const img = new Image();
        img.src = capturedPhotos[photoIdx];
        img.onload = () => {
          const py = startY + i * (photoH + gapY);
          ctx.drawImage(img, startX, py, photoW, photoH);
          loaded++;

          if (loaded === 4) {
            drawFrameDetails(ctx, width, height);
          }
        };
      });
    }

    function drawFrameDetails(ctx, width, height) {
      const isDark = currentFrameColor === '#111111';
      const textColor = isDark ? '#FFFFFF' : '#FFFFFF';

      ctx.textAlign = 'center';
      
      // Main Text
      ctx.fillStyle = textColor;
      ctx.font = '900 36px "Pretendard", sans-serif';
      ctx.fillText('행복을 쫓는 우리에게', width / 2, 1600);

      // Sub Text
      ctx.font = '700 20px "Pretendard", sans-serif';
      ctx.fillText('행운의 네잎보다 행복의 세잎 ☘️', width / 2, 1640);

      // Dynamic Today Date
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}.${mm}.${dd}`;

      ctx.font = '600 18px "Pretendard", sans-serif';
      ctx.fillText(dateStr, width / 2, 1675);

      // Draw Cut-off Black Shamrock (Clover) Icon at Bottom Right
      drawCutoffClover(ctx, width, height);
    }

    function drawCutoffClover(ctx, width, height) {
      ctx.save();
      // Right-bottom corner placement with cut-off overflow effect
      ctx.translate(width - 40, height - 20);
      ctx.fillStyle = '#111111';

      const leafRadius = 75;
      
      // Leaf 1 (Top)
      ctx.beginPath();
      ctx.arc(0, -leafRadius * 0.85, leafRadius, 0, Math.PI * 2);
      ctx.fill();

      // Leaf 2 (Left)
      ctx.beginPath();
      ctx.arc(-leafRadius * 0.85, 0, leafRadius, 0, Math.PI * 2);
      ctx.fill();

      // Leaf 3 (Right)
      ctx.beginPath();
      ctx.arc(leafRadius * 0.85, 0, leafRadius, 0, Math.PI * 2);
      ctx.fill();

      // Stem
      ctx.beginPath();
      ctx.moveTo(-10, 20);
      ctx.quadraticCurveTo(-20, 100, -60, 130);
      ctx.lineWidth = 18;
      ctx.strokeStyle = '#111111';
      ctx.stroke();

      ctx.restore();
    }

    function downloadImage() {
      const canvas = document.getElementById('photo-canvas');
      const link = document.createElement('a');
      link.download = `photo-booth-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function resetApp() {
      document.getElementById('step-result').classList.remove('active');
      document.getElementById('step-start').classList.add('active');
      btnStart.style.display = 'flex';
      btnQuick.style.display = 'none';
      shotCountEl.style.display = 'none';
    }
  </script>
</body>
</html>
